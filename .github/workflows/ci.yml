name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key
      DATABASE_URL: postgres://driveam:driveam@localhost:5432/driveam
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: driveam
          POSTGRES_USER: driveam
          POSTGRES_PASSWORD: driveam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driveam -d driveam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: mypy
        run: mypy .

      - name: Comprobar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest

  frontend:
    name: Frontend (lint · types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build
