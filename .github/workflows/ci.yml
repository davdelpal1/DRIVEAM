name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key
      DATABASE_URL: postgres://driveam:driveam@localhost:5432/driveam
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: driveam
          POSTGRES_USER: driveam
          POSTGRES_PASSWORD: driveam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driveam -d driveam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: mypy
        run: mypy .

      - name: Comprobar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest

  frontend:
    name: Frontend (lint · types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Se instala en el host ANTES de `docker compose up`: así `frontend/node_modules`
      # lo crea el runner. Si Compose arranca primero, Docker crea ese directorio como
      # root (punto de montaje del volumen `frontend_node_modules`) y `npm ci` falla
      # con EACCES.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar el navegador de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Preparar .env
        run: cp .env.example .env

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar al stack
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/api/v1/health/ >/dev/null \
              && curl -sf http://localhost:3000 >/dev/null; then
              echo "Stack listo"; exit 0
            fi
            sleep 2
          done
          echo "El stack no respondió a tiempo"; docker compose logs; exit 1

      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Logs del stack (si falla)
        if: failure()
        run: docker compose logs
