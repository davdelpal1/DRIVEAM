[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driveam-backend"
version = "0.1.0"
description = "DRIVEAM — API backend (Django + Django REST Framework)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<0.13",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "django-stubs[compatible-mypy]>=5.1,<6",
    "djangorestframework-stubs>=3.15,<4",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

# ------------------------------------------------------------------
# Ruff — lint + formato (sustituye a Black, ver ADR 0005)
# ------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
# RUF012: en Django/DRF los atributos de clase con listas (permission_classes, etc.)
# son idiomáticos; exigir ClassVar añade ruido sin valor.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ------------------------------------------------------------------
# mypy — tipado progresivo
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ['migrations/']

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# ------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]
addopts = "-ra --strict-markers"
